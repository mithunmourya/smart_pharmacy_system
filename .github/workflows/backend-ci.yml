
name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # Start temporary MySQL
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: smart_pharmacy_test
          MYSQL_USER: pharmacy_test
          MYSQL_PASSWORD: ci_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Test database connection settings
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_USER: pharmacy_test
      DB_PASSWORD: ci_test_password
      DB_NAME: smart_pharmacy_test
      MYSQL_PWD: ci_test_password
      JWT_SECRET: ci-test-only-secret
      JWT_EXPIRES_IN: 1h

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Download repository code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify MySQL database
        run: |
          test "$DB_NAME" = "smart_pharmacy_test"
          mysql -h 127.0.0.1 -u "$DB_USER" "$DB_NAME" -e "SELECT DATABASE();"

      - name: Import pharmacy schema
        run: |
          mysql -h 127.0.0.1 -u "$DB_USER" "$DB_NAME" < smart_pharmacy_schema.sql

      - name: Verify tables and views
        run: |
          mysql -h 127.0.0.1 -u "$DB_USER" "$DB_NAME" -e "SHOW FULL TABLES;"

      - name: Run Jest unit tests
        run: npm run test:unit

      - name: Run Jest integration tests
        run: npm run test:integration
